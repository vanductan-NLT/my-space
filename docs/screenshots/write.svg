<rect x="150" y="116" width="222" height="46" rx="13" fill="#202020" stroke="#343434"/><circle cx="172" cy="139" r="7" fill="none" stroke="#818181" stroke-width="2"/><path d="m178 145 6 6" stroke="#818181" stroke-width="2"/><text x="195" y="146" fill="#777" font-size="15">Search documents</text>
<rect x="140" y="180" width="242" height="70" rx="13" fill="#242424"/><rect x="140" y="194" width="4" height="42" rx="2" fill="#99e5b7"/><text x="160" y="208" fill="#fff" font-size="16" font-weight="700">Welcome to My Space</text><text x="160" y="231" fill="#777" font-size="13">Edited just now</text>
