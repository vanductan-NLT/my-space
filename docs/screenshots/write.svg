<line x1="396" y1="94" x2="1570" y2="94" stroke="#333"/><text x="430" y="70" fill="#aaa" font-size="18">☰</text><text x="470" y="70" fill="#fff" font-size="17" font-weight="600">Welcome to My Space</text><text x="1325" y="70" fill="#65c88d" font-size="14">✓ Saved</text><text x="1430" y="70" fill="#aaa" font-size="16">Focus</text>
<g transform="translate(530 170)"><text fill="#fff" font-family="Georgia, serif" font-size="48" font-weight="700">A quiet place for clear thinking.</text><text y="72" fill="#b8b8b8" font-family="Georgia, serif" font-size="23">Everything you write stays in this browser.</text><text y="110" fill="#b8b8b8" font-family="Georgia, serif" font-size="23">No accounts, no cloud, no distractions.</text><rect y="160" width="760" height="1" fill="#333"/><text y="220" fill="#9be6b7" font-size="15" font-weight="700">YOUR SPACE, YOUR WORDS</text><text y="270" fill="#eee" font-family="Georgia, serif" font-size="24">Type freely, organize ideas, and export whenever you want.</text><text y="312" fill="#eee" font-family="Georgia, serif" font-size="24">Use the slash menu for headings, lists, tables, and more.</text><rect y="370" width="690" height="120" rx="16" fill="#1d1d1d" stroke="#343434"/><text x="26" y="410" fill="#fff" font-size="18" font-weight="700">Today’s intention</text><text x="26" y="448" fill="#aaa" font-size="18">Make space for the work that matters.</text><circle cx="30" cy="535" r="9" fill="none" stroke="#9be6b7" stroke-width="2"/><text x="55" y="542" fill="#ddd" font-size="18">Draft the launch story</text><circle cx="30" cy="582" r="9" fill="none" stroke="#777" stroke-width="2"/><text x="55" y="589" fill="#aaa" font-size="18">Review product notes</text></g>
<text x="160" y="925" fill="#aaa" font-size="14">Export</text><text x="285" y="925" fill="#aaa" font-size="14">Import</text></g>
