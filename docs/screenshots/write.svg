<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">My Space Write workspace</title><desc id="desc">Dark local-first writing workspace with document library and focused editor.</desc>
