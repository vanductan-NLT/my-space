<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">My Space Work mode with TanFlow</title>
  <desc id="desc">A focused Pomodoro workspace with a task list, timer, ambient sound, and daily progress.</desc>
  <defs>
    <radialGradient id="shell"><stop stop-color="#173226"/><stop offset=".56" stop-color="#111"/></radialGradient>
    <linearGradient id="panel" x2="1" y2="1"><stop stop-color="#1e2d26"/><stop offset="1" stop-color="#171717"/></linearGradient>
    <filter id="shadow"><feDropShadow dy="18" stdDeviation="24" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#shell)"/>
  <rect x="30" y="30" width="72" height="940" rx="22" fill="#1a1a1a" stroke="#343434"/>
  <circle cx="66" cy="76" r="17" fill="none" stroke="#99e5b7" stroke-width="3"/>
  <g fill="#888"><rect x="49" y="158" width="34" height="34" rx="9"/><rect x="49" y="216" width="34" height="34" rx="9"/><rect x="43" y="261" width="46" height="60" rx="13" fill="#233d2d"/><rect x="49" y="332" width="34" height="34" rx="9"/></g>
  <rect x="126" y="30" width="1444" height="940" rx="22" fill="#151515" stroke="#343434" filter="url(#shadow)"/>
  <path d="M126 92h1444" stroke="#343434"/>
  <g font-family="Arial, sans-serif">
    <rect x="150" y="45" width="38" height="38" rx="11" fill="#233d2d"/><circle cx="169" cy="64" r="10" fill="none" stroke="#99e5b7" stroke-width="2"/><path d="M169 58v7l5 3" stroke="#99e5b7" stroke-width="2" fill="none"/>
    <text x="202" y="70" fill="#fff" font-size="18" font-weight="700">TanFlow</text>
    <text x="1435" y="68" fill="#aaa" font-size="15">↗ Open in new tab</text>
    <text x="205" y="166" fill="#777" font-size="14" font-weight="700" letter-spacing="2">TODAY · DEEP WORK</text>
    <text x="205" y="213" fill="#fff" font-size="34" font-weight="700">Make today count.</text>
    <rect x="205" y="255" width="780" height="600" rx="24" fill="url(#panel)" stroke="#35453d"/>
    <text x="255" y="313" fill="#aaa" font-size="14" font-weight="700" letter-spacing="1">FOCUS TIMER</text>
    <circle cx="595" cy="493" r="142" fill="none" stroke="#2e3b35" stroke-width="15"/>
    <path d="M595 351a142 142 0 1 1-135 98" fill="none" stroke="#99e5b7" stroke-width="15" stroke-linecap="round"/>
    <text x="495" y="490" fill="#fff" font-size="64" font-weight="700">24:18</text>
    <text x="548" y="527" fill="#8d9a94" font-size="15" letter-spacing="2">FOCUS</text>
    <rect x="520" y="580" width="150" height="52" rx="26" fill="#99e5b7"/><text x="568" y="613" fill="#102017" font-size="16" font-weight="700">Pause</text>
    <text x="255" y="703" fill="#aaa" font-size="14">Current intention</text><text x="255" y="742" fill="#fff" font-size="21" font-weight="700">Finish the product launch story</text>
    <rect x="255" y="780" width="680" height="9" rx="5" fill="#303a35"/><rect x="255" y="780" width="425" height="9" rx="5" fill="#99e5b7"/>
    <rect x="1020" y="255" width="370" height="285" rx="22" fill="#1d1d1d" stroke="#343434"/>
    <text x="1055" y="306" fill="#fff" font-size="19" font-weight="700">Today’s sessions</text><text x="1055" y="352" fill="#99e5b7" font-size="46" font-weight="700">3</text><text x="1110" y="352" fill="#888" font-size="15">of 5 complete</text>
    <g fill="#99e5b7"><circle cx="1068" cy="405" r="9"/><circle cx="1110" cy="405" r="9"/><circle cx="1152" cy="405" r="9"/></g><g fill="#363636"><circle cx="1194" cy="405" r="9"/><circle cx="1236" cy="405" r="9"/></g>
    <text x="1055" y="470" fill="#aaa" font-size="14">75 minutes of focused work</text>
    <rect x="1020" y="570" width="370" height="285" rx="22" fill="#1d1d1d" stroke="#343434"/>
