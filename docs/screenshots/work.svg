    <g fill="#53635b"><rect x="1055" y="752" width="8" height="31" rx="4"/><rect x="1071" y="736" width="8" height="47" rx="4"/><rect x="1087" y="744" width="8" height="39" rx="4"/><rect x="1103" y="726" width="8" height="57" rx="4"/><rect x="1119" y="750" width="8" height="33" rx="4"/><rect x="1135" y="738" width="8" height="45" rx="4"/></g>
  </g>
